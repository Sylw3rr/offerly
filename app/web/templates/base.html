<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Offerly{% endblock %}</title>
  <style>
    :root {
      --bg: #fbfbfa; --panel: #fff; --ink: #1c1b19; --muted: #6b6862;
      --line: #e4e1db; --accent: #1f6f5c; --danger: #a33;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --panel: #1f2124; --ink: #ececec; --muted: #9a9892;
        --line: #33363b; --accent: #4bb79a; --danger: #e08585;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line); padding: 1rem 1.25rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header a.brand { font-weight: 650; letter-spacing: -.01em; text-decoration: none; color: var(--ink); }
    main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 1.75rem; max-width: 26rem; margin: 3rem auto;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .35rem; letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .92rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: .9rem 0 .3rem; }
    input {
      width: 100%; padding: .6rem .7rem; border: 1px solid var(--line);
      border-radius: 7px; background: var(--bg); color: var(--ink); font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      margin-top: 1.4rem; width: 100%; padding: .65rem; border: 0; border-radius: 7px;
      background: var(--accent); color: #fff; font-size: 1rem; font-weight: 550; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .error {
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      border: 1px solid var(--danger); color: var(--danger);
      padding: .6rem .75rem; border-radius: 7px; font-size: .9rem; margin-bottom: 1rem;
    }
    .foot { margin-top: 1.4rem; font-size: .88rem; color: var(--muted); text-align: center; }
    a { color: var(--accent); }
    .linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .88rem; width: auto; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Offerly</a>
    {% if user %}
      <form method="post" action="/logout" style="margin:0">
        <button class="linkbtn" type="submit">Sign out ({{ user.email }})</button>
      </form>
    {% endif %}
  </header>
  {% block body %}{% endblock %}
</body>
</html>
