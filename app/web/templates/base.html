<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Offerly{% endblock %}</title>
  <style>
    :root {
      --bg: #fbfbfa; --panel: #fff; --ink: #1c1b19; --muted: #6b6862;
      --line: #e4e1db; --accent: #1f6f5c; --danger: #a33;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a; --panel: #1f2124; --ink: #ececec; --muted: #9a9892;
        --line: #33363b; --accent: #4bb79a; --danger: #e08585;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      border-bottom: 1px solid var(--line); padding: 1rem 1.25rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header a.brand { font-weight: 650; letter-spacing: -.01em; text-decoration: none; color: var(--ink); }
    main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 1.75rem; max-width: 26rem; margin: 3rem auto;
    }
    h1 { font-size: 1.4rem; margin: 0 0 .35rem; letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .92rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin: .9rem 0 .3rem; }
    input {
      width: 100%; padding: .6rem .7rem; border: 1px solid var(--line);
      border-radius: 7px; background: var(--bg); color: var(--ink); font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      margin-top: 1.4rem; width: 100%; padding: .65rem; border: 0; border-radius: 7px;
      background: var(--accent); color: #fff; font-size: 1rem; font-weight: 550; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .error {
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      border: 1px solid var(--danger); color: var(--danger);
      padding: .6rem .75rem; border-radius: 7px; font-size: .9rem; margin-bottom: 1rem;
    }
    .foot { margin-top: 1.4rem; font-size: .88rem; color: var(--muted); text-align: center; }
    a { color: var(--accent); }
    .linkbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .88rem; width: auto; margin: 0; padding: 0; }

    /* Registry */
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .btn {
      background: var(--accent); color: #fff; text-decoration: none;
      padding: .5rem .9rem; border-radius: 7px; font-size: .92rem; font-weight: 550;
    }
    .sub { color: var(--muted); }
    .dim { color: var(--muted); }
    .hint { color: var(--muted); font-size: .87rem; margin: .2rem 0 1rem; }

    .stats { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1.5rem 0; }
    .stat {
      background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
      padding: .8rem 1.1rem; min-width: 7rem;
    }
    .stat .num { display: block; font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; }
    .stat .lbl { font-size: .8rem; color: var(--muted); }

    .filters { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .chip {
      border: 1px solid var(--line); border-radius: 999px; padding: .25rem .7rem;
      font-size: .84rem; text-decoration: none; color: var(--muted); background: var(--panel);
    }
    .chip.on { border-color: var(--accent); color: var(--accent); }

    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    th, td { text-align: left; padding: .65rem .8rem; border-bottom: 1px solid var(--line); font-size: .92rem; }
    th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); }
    tbody tr:last-child td { border-bottom: 0; }

    .badge { font-size: .78rem; padding: .15rem .55rem; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
    .s-offer, .s-interview { border-color: var(--accent); color: var(--accent); }
    .s-rejected, .s-ghosted { border-color: var(--danger); color: var(--danger); }
    .s-blocked { border-color: #c88a2e; color: #c88a2e; }

    .empty { color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 9px; padding: 2rem; text-align: center; }

    .form-wide { max-width: 46rem; }
    fieldset { border: 1px solid var(--line); border-radius: 9px; padding: 1rem 1.2rem 1.3rem; margin: 0 0 1.2rem; background: var(--panel); }
    legend { font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 0 .4rem; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0 1rem; }
    .grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0 1rem; }
    select, textarea {
      width: 100%; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 7px;
      background: var(--bg); color: var(--ink); font-size: 1rem; font-family: inherit;
    }
    .actions { display: flex; align-items: center; gap: 1rem; }
    .actions button { width: auto; padding: .6rem 1.4rem; margin-top: 1rem; }
    .cancel { margin-top: 1rem; color: var(--muted); font-size: .9rem; }
    .inline-form { display: flex; gap: .5rem; margin-top: .7rem; }
    .inline-form input { flex: 1; }
    .inline-form button { width: auto; margin: 0; padding: .5rem 1rem; }
    .cv-add { margin-top: 2rem; color: var(--muted); font-size: .9rem; }

    .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 1.1rem 1.3rem 1.4rem; }
    .panel h2 { font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 .8rem; }
    .panel button { width: auto; padding: .55rem 1.2rem; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; margin: 0; font-size: .93rem; }
    dt { color: var(--muted); }
    dd { margin: 0; }
    .notes { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); font-size: .93rem; }
    .timeline { list-style: none; padding: 0; margin: 0; font-size: .92rem; }
    .timeline li { padding: .5rem 0; border-bottom: 1px solid var(--line); }
    .timeline li:last-child { border-bottom: 0; }
    .when { color: var(--muted); margin-right: .6rem; font-variant-numeric: tabular-nums; }
    .back { text-decoration: none; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Offerly</a>
    {% if user %}
      <form method="post" action="/logout" style="margin:0">
        <button class="linkbtn" type="submit">Sign out ({{ user.email }})</button>
      </form>
    {% endif %}
  </header>
  {% block body %}{% endblock %}
</body>
</html>
