{% extends "base.html" %}
{% block title %}{{ t('auth.reset_title') }} — Offerly{% endblock %}
{% block body %}
<main style="max-width:460px;padding-top:12vh">
  <section class="card elev-md" style="padding:32px 30px;gap:18px">
    <div>
      <h1 style="font-size:25px">{{ t('auth.reset_title') }}</h1>
      <p class="muted" style="margin:6px 0 0;font-size:14px">{{ t('auth.reset_sub') }}</p>
    </div>

    {% if sent %}
      <p style="margin:0;font-size:14px">{{ sent }}</p>
      <a class="btn btn-secondary btn-block" href="/login">{{ t('auth.reset_back') }}</a>
    {% else %}
      <form method="post" action="/forgot-password" class="stack" style="gap:16px">
        <div class="field">
          <label for="email">{{ t('auth.email') }}</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email"
                 required autofocus style="min-height:42px">
        </div>
        <button class="btn btn-primary btn-block" type="submit" style="padding:11px">{{ t('auth.reset_send') }}</button>
      </form>
      <a class="btn btn-ghost" style="justify-self:center" href="/login">{{ t('auth.reset_back') }}</a>
    {% endif %}
  </section>
</main>
{% endblock %}
