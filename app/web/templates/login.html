{% extends "base.html" %}
{% block title %}Sign in — Offerly{% endblock %}
{% block body %}
<div class="card">
  <h1>Sign in</h1>
  <p class="sub">Track your applications and see who replied.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/login">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>

    <button type="submit">Sign in</button>
  </form>

  <p class="foot"><a href="/forgot-password">Forgot your password?</a></p>
  <p class="foot">Have an invite code? <a href="/signup">Create an account</a></p>
</div>
{% endblock %}
