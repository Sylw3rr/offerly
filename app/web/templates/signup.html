{% extends "base.html" %}
{% block title %}Create account — Offerly{% endblock %}
{% block body %}
<div class="card">
  <h1>Create account</h1>
  <p class="sub">Offerly is invite-only while it is being built.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post" action="/signup">
    <label for="invite_code">Invite code</label>
    <input id="invite_code" name="invite_code" value="{{ invite_code or '' }}" required autofocus>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required>

    <label for="password">Password <span style="opacity:.7">(at least 10 characters)</span></label>
    <input id="password" name="password" type="password" minlength="10" required>

    <button type="submit">Create account</button>
  </form>

  <p class="foot">Already have an account? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
